services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-ai-grading
    restart: always
    ports:
      # set the host port by your own, and the container port is 11434
      - "11941:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ollama-net

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # ใช้ GPU ทั้งหมด
              capabilities: [gpu]

volumes:
  ollama_data:

networks:
  ollama-net:
    driver: bridge

