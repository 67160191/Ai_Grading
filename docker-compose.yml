services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend/data:/app/data:Z
      # multer resolves uploads relative to src/routes -> /app/src/uploads
      - ./backend/src/uploads:/app/src/uploads:Z
    expose:
      - "3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
